<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FR𓆏GUE - profil</title>
    <link rel="stylesheet" href="profil.css">
</head>

<body>
<!--     <img class="image" src="img/windows-7-background-imfecqv6cnsicbx4.png">
 -->    
    <div class="fenetre">
        <div class="top-panel">
            <strong>PROFIL</strong>
            <button><strong>X</strong></button>
        </div>
        
        <div class="content">
            <div class="container">
                <div class="name">
                    <span>Username :</span>
                    <span id="username"></span>
                </div>

                <div class="floor">
                    <span>Floor :</span>
                    <span id="floor"></span>
                </div>

                <div class="hp">
                    <span>HP :</span>
                    <span id="hp"></span>
                </div>

                <div class="strength">
                    <span>Strength :</span>
                    <span id="strength"></span>
                </div>

                <div class="run">
                    <span>Run :</span>
                    <span id="run"></span>
                </div>


            </div>

            <div class="container">
                <div class="creation">
                    <img src="https://static.wikia.nocookie.net/characterprofile/images/b/bc/Download_%282%29.png/revision/latest?cb=20200825171717"
                        alt="">
                </div>
            </div>

            <div class="container">
                <p class="controls-container">
                    <button class="damage-button" data-amount="100">100 Damage</button>
                    <button class="damage-button" data-amount="random">Random(5, 30) Damage</button>
                    <button class="damage-button" data-amount="10">10 Damage</button>
                </p>
                <p class="controls-container">
                    <button class="heal-button" data-amount="100">100 Heal</button>
                    <button class="heal-button" data-amount="random">Random(50, 100) Heal</button>
                    <button class="heal-button" data-amount="10">10 Heal</button>
                </p>

            </div>

        </div>  

    </div>

</body>

<script src="profil.js"></script>
</html>
